server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Límite alineado con el máximo de adjuntos (5 MB) más margen.
    client_max_body_size 6m;

    # Proxy a la API: el navegador usa el mismo origen, sin CORS.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:3000/health;
    }

    # Recursos con hash en el nombre: caché larga e inmutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: cualquier ruta desconocida devuelve index.html (React Router decide).
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy no-referrer;
}
